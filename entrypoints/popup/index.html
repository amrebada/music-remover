<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- WXT copies the title into the manifest's toolbar tooltip, which Chrome translates. -->
    <title data-i18n="extName">__MSG_extName__</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="extName">Music Remover</h1>
      <p class="sub" data-i18n="popupSubtitle">Keeps the voices, removes the music. Runs on your device.</p>
    </header>

    <section class="card" aria-labelledby="tab-heading">
      <h2 id="tab-heading" data-i18n="thisTab">This tab</h2>
      <p id="tab-status" class="status" data-i18n="checking">Checking…</p>
      <button id="live-toggle" type="button" class="primary" data-i18n="startLive">Start live mode</button>
      <p id="live-hint" class="hint"></p>
    </section>

    <section class="card" aria-labelledby="settings-heading">
      <h2 id="settings-heading" data-i18n="settings">Settings</h2>

      <label class="switch-row">
        <span>
          <span data-i18n="removeAutomatically">Remove music automatically</span>
          <small data-i18n="removeAutomaticallySites">YouTube, Facebook, Instagram, LinkedIn</small>
        </span>
        <input id="enabled" type="checkbox" role="switch" />
      </label>

      <label class="field">
        <span><span data-i18n="musicRemoval">Music removal</span> <output id="strength-value">100%</output></span>
        <input id="strength" type="range" min="0" max="100" step="5" />
      </label>

      <label class="field">
        <span data-i18n="quality">Quality</span>
        <select id="quality">
          <option value="fast" data-i18n="qualityFast">Fast (36 MB model)</option>
          <option value="high" data-i18n="qualityHigh">High (181 MB model, needs a GPU)</option>
        </select>
        <small id="model-status" class="hint"></small>
      </label>

      <label class="field">
        <span data-i18n="liveDelay">Live mode delay</span>
        <select id="liveLatency">
          <option value="low" data-i18n="latencyLow">Lowest</option>
          <option value="balanced" data-i18n="latencyBalanced">Balanced</option>
          <option value="clean" data-i18n="latencyClean">Cleanest</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="beforeReady">Before cleaned audio is ready</span>
        <select id="whenNotReady">
          <option value="mute" data-i18n="notReadyMute">Mute</option>
          <option value="original" data-i18n="notReadyOriginal">Play the original</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="language">Language</span>
        <select id="language">
          <option value="auto" data-i18n="languageAuto">Automatic (browser language)</option>
          <!-- Each language is named in itself, so it can be found whatever is showing. -->
          <option value="en" lang="en">English</option>
          <option value="ar" lang="ar">العربية</option>
        </select>
      </label>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
