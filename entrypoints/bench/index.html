<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Music Remover benchmark</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
      table { border-collapse: collapse; width: 100%; margin-top: 16px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
      label { display: block; margin: 8px 0; }
      #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: #555; }
    </style>
  </head>
  <body>
    <h1>Music Remover benchmark</h1>
    <p>Pick a mix (speech + music). Add the clean speech to also get SI-SDR. Files are decoded at 44.1 kHz stereo.</p>
    <label>Mix <input id="mix" type="file" accept="audio/*" /></label>
    <label>Reference speech (optional) <input id="ref" type="file" accept="audio/*" /></label>
    <button id="run" type="button">Run both models</button>
    <table>
      <thead><tr><th>Model</th><th>Backend</th><th>Real-time factor</th><th>SI-SDR (mix → voice)</th><th>Listen</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
    <p id="log"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
